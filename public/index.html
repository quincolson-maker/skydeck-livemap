<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyDeck Live Map</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f4f1e8;font-family:"Helvetica Neue",Arial,sans-serif;cursor:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff}
#wrap{position:relative;aspect-ratio:16/9;width:min(100vw,177.78vh);background:#e8dfc8 center/cover no-repeat}
canvas{position:absolute;inset:0;width:100%;height:100%}
.card{position:absolute;background:#fff;border:.12vw solid #222;color:#111;box-shadow:0 .2vw .6vw rgba(0,0,0,.25);font-size:.95vw;line-height:1.35}
.card h3{margin:0 0 .35vw;font-size:.82vw;letter-spacing:.12em;text-transform:uppercase;border-bottom:.08vw solid #222;padding-bottom:.25vw}
#legend{left:1.2%;bottom:2.2%;padding:.6vw .9vw;min-width:9vw}
#legend .r{display:flex;align-items:center;gap:.6vw;margin:.18vw 0;font-weight:700}
#legend .d{width:1.1vh;height:1.1vh;border-radius:50%;box-sizing:border-box;border:.16vh solid #111;flex:none}
#legend .small{font-size:.68vw;font-weight:400;color:#444;margin-top:.35vw}
#plan{left:calc(1.2% + 12.4vw);bottom:2.2%;padding:.6vw .9vw;min-width:15vw;display:none}
#plan .big{font-size:1.6vw;font-weight:800;letter-spacing:.03em}
#plan .row{display:flex;justify-content:space-between;gap:1.2vw}
#plan .lab{font-size:.66vw;letter-spacing:.12em;color:#555;text-transform:uppercase}
#plan .val{font-size:1.05vw;font-weight:700}
#title{left:1.2%;top:2%;padding:.45vw .8vw;font-size:1.05vw;font-weight:800;letter-spacing:.06em}
#title span{font-weight:400;font-size:.75vw;letter-spacing:0;color:#333;margin-left:.6vw}
#radarBtn{position:absolute;right:1.2%;bottom:2.2%;padding:.6vw 1.1vw;font:800 1vw "Helvetica Neue",Arial;background:#fff;border:.12vw solid #222;cursor:pointer;letter-spacing:.08em}
#radarBtn.on{background:#1f6f2b;color:#fff}
#radarBtn:focus{outline:.25vw solid #ffb300}
#stale{color:#b00;font-weight:800;display:none}

.card{z-index:3}#radarBtn{z-index:3}
#dim{z-index:2;position:absolute;inset:0;background:rgba(10,14,22,.5);opacity:0;transition:opacity .8s;pointer-events:none}
#dim.on{opacity:1}
#spot{z-index:4;position:absolute;left:36.5%;right:1.5%;top:3%;bottom:3%;background:#fff;border:.14vw solid #111;box-shadow:0 .5vw 2vw rgba(0,0,0,.45);opacity:0;transform:translateX(3%) scale(.98);transition:opacity .6s ease,transform .6s ease;display:flex;flex-direction:column;padding:1.2vw 1.4vw;box-sizing:border-box;color:#111;pointer-events:none}
#spot.on{opacity:1;transform:none}
#spot .hd{display:flex;align-items:center;gap:1.2vw;border-bottom:.12vw solid #111;padding-bottom:.6vw;margin-bottom:.9vw}
#spot .sid{font-size:3.6vw;font-weight:900;letter-spacing:.04em;line-height:1}
#spot .snm{font-size:1.35vw;font-weight:700;line-height:1.2}
#spot .ssub{font-size:.85vw;color:#444;letter-spacing:.1em;text-transform:uppercase;margin-top:.2vw}
#spot .cat{margin-left:auto;font-size:2vw;font-weight:900;color:#fff;padding:.35vw 1.1vw;border-radius:.3vw;letter-spacing:.06em}
#spot .bd{flex:1;display:flex;gap:1.2vw;min-height:0}
#spot .wx{flex:0 0 46%;display:flex;flex-direction:column;gap:.5vw;min-width:0}
#spot .kv{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.06vw solid #ccc;padding:.2vw 0}
#spot .k{font-size:.8vw;letter-spacing:.14em;color:#555;text-transform:uppercase;font-weight:700}
#spot .v{font-size:1.55vw;font-weight:800;text-align:right}
#spot .raw{font:600 .78vw/1.35 Menlo,Consolas,monospace;color:#222;background:#f3f3ef;padding:.4vw .5vw;border-left:.25vw solid #888;white-space:pre-wrap;word-break:break-word}
#spot .lab2{font-size:.8vw;letter-spacing:.14em;color:#555;text-transform:uppercase;font-weight:800;margin-top:.3vw}
#spot .img{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#spot .img .box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#f6f6f2;border:.08vw solid #999;overflow:hidden}
#spot .wx .img{flex:1;min-height:6vw;margin-top:.3vw}
#spot .img .box img,#spot .img .box canvas{max-width:100%;max-height:100%;object-fit:contain;display:block}
#spot .cap{font-size:.72vw;color:#444;margin-top:.3vw;letter-spacing:.04em}
#spot .phase{position:absolute;right:1.4vw;bottom:.6vw;font-size:.7vw;color:#666;letter-spacing:.1em}
</style></head><body>
<div id="stage"><div id="wrap">
<canvas id="base"></canvas><canvas id="radar"></canvas><canvas id="route"></canvas><canvas id="leds"></canvas>
<div class="card" id="title">SKYDECK LIVE MAP <span id="clock">—</span> <span id="stale">STALE</span></div>
<div class="card" id="legend"><h3>Flight Category</h3>
<div class="r"><i class="d" data-c="VFR"></i>VFR</div>
<div class="r"><i class="d" data-c="MVFR"></i>MVFR</div>
<div class="r"><i class="d" data-c="IFR"></i>IFR</div>
<div class="r"><i class="d" data-c="LIFR"></i>LIFR</div>
<div class="small" id="cnt"></div><div class="small" id="rtime"></div></div>
<div class="card" id="plan"><h3>Flight Plan</h3><div class="big" id="pRoute"></div>
<div class="row" style="margin-top:.3vw"><div><div class="lab">Depart</div><div class="val" id="pDep"></div></div><div><div class="lab">Arrive (ETA)</div><div class="val" id="pEta"></div></div></div>
<div class="row" style="margin-top:.2vw"><div><div class="lab">Route</div><div class="val" id="pVia" style="font-size:.8vw;font-weight:400"></div></div><div><div class="lab">Dist</div><div class="val" id="pDist"></div></div></div></div>
<div id="dim"></div><div id="spot"></div>
<button id="radarBtn" tabindex="0">RADAR OFF (R)</button>
</div></div>
<script>
const LED=new URLSearchParams(location.search).get('style')==='led';
// Sharp TV markers: standard aviation colors, slightly boosted saturation. ?style=led keeps the old glow look.
const COL=LED?{VFR:'#00e000',MVFR:'#2060ff',IFR:'#ff1a1a',LIFR:'#ff00ff'}:{VFR:'#00c83c',MVFR:'#0a50ff',IFR:'#f00010',LIFR:'#e600e6'};
document.querySelectorAll('#legend .d').forEach(e=>{const c=COL[e.dataset.c];e.style.background=c;if(LED){e.style.border='0';e.style.width=e.style.height='.9vw';e.style.boxShadow='0 0 .5vw '+c}});
const Q=new URLSearchParams(location.search);
let C,W,H,DPR,stations=[],planData=null,radarOn=Q.get('radar')==='1'||localStorage.radar==='1',radarImg=null,radarT=null;
const all=Q.get('all')==='1';
const $=id=>document.getElementById(id);
// Lambert conformal conic (spherical-ellipsoid good enough at chart scale: use WGS84 ellipsoid formulas)
let P;function initProj(c){const a=6378137,e=0.0818191908426,r=Math.PI/180;const m=f=>Math.cos(f)/Math.sqrt(1-e*e*Math.sin(f)**2),t=f=>Math.tan(Math.PI/4-f/2)/((1-e*Math.sin(f))/(1+e*Math.sin(f)))**(e/2);
 const f1=c.lat1*r,f2=c.lat2*r,f0=c.lat0*r,n=(Math.log(m(f1))-Math.log(m(f2)))/(Math.log(t(f1))-Math.log(t(f2))),F=m(f1)/(n*t(f1)**n),r0=a*F*t(f0)**n;
 P={c,fwd(lat,lon){const rr=a*F*t(lat*r)**n,th=n*(lon-c.lon0)*r;return[rr*Math.sin(th),r0-rr*Math.cos(th)]},
 inv(x,y){const rp=Math.sign(n)*Math.hypot(x,r0-y),tp=(rp/(a*F))**(1/n),th=Math.atan2(x,r0-y);let f=Math.PI/2-2*Math.atan(tp);for(let i=0;i<4;i++)f=Math.PI/2-2*Math.atan(tp*((1-e*Math.sin(f))/(1+e*Math.sin(f)))**(e/2));return[f/r,th/n/r+c.lon0]}};}
let V=null;// visible window in chart-frame metres {x0,x1,y0,y1}
const px=(lat,lon)=>{const[x,y]=P.fwd(lat,lon);return[(x-V.x0)/(V.x1-V.x0)*W,(V.y1-y)/(V.y1-V.y0)*H]};
function size(){const w=$('wrap').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);W=Math.round(w.width*DPR);H=Math.round(w.height*DPR);for(const id of['base','radar','route','leds']){const c=$(id);c.width=W;c.height=H}drawBase();drawRadar();drawRoute();drawLeds()}
let states=null,chartOK=false;
// ---- Deep-zoom FAA sectional tiles (public/tiles/L/row/col.webp, 512 px; level 0 = 3840 px wide frame) ----
const TC=new Map();let fullImg=null,baseQ=0;
function tileImg(l,x,y){const k=l+'/'+y+'/'+x;let t=TC.get(k);if(!t){const im=new Image();t={im,ok:false,bad:false};im.onload=()=>{t.ok=true;queueBase()};im.onerror=()=>{t.bad=true};im.src='/tiles/'+k+'.'+(P.c.tileExt||'webp');TC.set(k,t);if(TC.size>900){const it=TC.keys().next().value;TC.delete(it)}}return t}
function queueBase(){if(!baseQ)baseQ=requestAnimationFrame(()=>{baseQ=0;drawBase()})}
function drawBase(){const g=$('base').getContext('2d'),c=P.c;g.fillStyle='#e9e0c6';g.fillRect(0,0,W,H);
 if(chartOK){const FW=c.xmax-c.xmin,FH=c.ymax-c.ymin;g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  const iw=fullImg.naturalWidth,ih=fullImg.naturalHeight;g.drawImage(fullImg,(V.x0-c.xmin)/FW*iw,(c.ymax-V.y1)/FH*ih,(V.x1-V.x0)/FW*iw,(V.y1-V.y0)/FH*ih,0,0,W,H);
  const need=W*FW/((V.x1-V.x0)*c.w);let L=Math.max(0,Math.min(c.maxLevel||0,Math.ceil(Math.log2(need)-0.15)));
  if(c.maxLevel!=null&&(need>iw/c.w*1.05)&&tilesOK)for(let l=Math.max(1,L-2);l<=L;l++){const isL=l===L,Wl=c.w*2**l,mpp=FW/Wl,T=c.tile,mt=mpp*T;
   const tx0=Math.max(0,Math.floor((V.x0-c.xmin)/mt)),tx1=Math.floor((V.x1-c.xmin)/mt),ty0=Math.max(0,Math.floor((c.ymax-V.y1)/mt)),ty1=Math.floor((c.ymax-V.y0)/mt);
   const sx=W/(V.x1-V.x0);for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){const k=l+'/'+ty+'/'+tx;const t=isL?tileImg(l,tx,ty):TC.get(k);if(!t||!t.ok)continue;
    const X=(c.xmin+tx*mt-V.x0)*sx,Y=(V.y1-(c.ymax-ty*mt))*sx;g.drawImage(t.im,Math.floor(X),Math.floor(Y),Math.ceil(mt*sx)+1,Math.ceil(mt*sx)+1)}}
  return}
 if(!states)return;// fallback if chart raster unavailable
 g.fillStyle='#e9e0c6';g.fillRect(0,0,W,H);g.strokeStyle='#7a6a55';g.lineWidth=1.2*DPR;g.beginPath();for(const f of states.features)for(const ln of f.geometry.coordinates){ln.forEach(([lo,la],i)=>{const[x,y]=px(la,lo);i?g.lineTo(x,y):g.moveTo(x,y)})}g.stroke()}
// LED station selection: manned (non-AUTO) stations first, then grid-thinned to ~LED density
function pick(list){if(all)return list;const keep=new Set(['KPAH','KMWA','KCGI','KEVV','KSTL','KBNA','KMEM','KSDF']);const cell=W/34;const occ=new Map(),out=[];
 const sorted=list.filter(s=>/^K[A-Z]{3}$/.test(s[0])||keep.has(s[0])).sort((a,b)=>(keep.has(b[0])-keep.has(a[0]))||(b[4]-a[4]));
 for(const s of sorted){const[x,y]=px(s[1],s[2]);if(x<0||y<0||x>W||y>H)continue;const k=Math.floor(x/cell)+','+Math.floor(y/cell);if(occ.has(k)&&!keep.has(s[0]))continue;occ.set(k,1);out.push([s,x,y])}return out}
function drawLeds(){const g=$('leds').getContext('2d');g.clearRect(0,0,W,H);const r=W/420;let n=0;
 const list=pick(stations).map(v=>Array.isArray(v[0])?v:[v,...px(v[1],v[2])]);
 if(!LED){// crisp flat markers: radius ~0.55% of viewport height, dark ring, no blur
  const R=Math.max(3,H*0.0055),lw=Math.max(1,Math.round(R*0.32));g.lineWidth=lw;g.strokeStyle='rgba(17,17,17,.95)';
  for(const[s,x,y]of list){const c=COL[s[3]];if(!c)continue;n++;g.fillStyle=c;g.beginPath();g.arc(x,y,R,0,Math.PI*2);g.fill();g.stroke();}
 }else for(const[s,x,y]of list){const c=COL[s[3]];if(!c)continue;n++;
  const gr=g.createRadialGradient(x,y,0,x,y,r*4.2);gr.addColorStop(0,c+'cc');gr.addColorStop(.35,c+'55');gr.addColorStop(1,c+'00');g.fillStyle=gr;g.beginPath();g.arc(x,y,r*4.2,0,7);g.fill();
  g.fillStyle=c;g.beginPath();g.arc(x,y,r*1.15,0,7);g.fill();g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(x-r*.3,y-r*.3,r*.45,0,7);g.fill();}
 $('cnt').textContent=n+' stations'}
// Radar is reprojected ONCE into chart-frame space (RF = full CONUS, RHi = sharper crop for the zoomed view), then every frame
// it is drawn with the same source->screen mapping as the chart, so it pans/zooms in lockstep (no per-frame reprojection, no pop).
let RF=null,RHi=null,rhT=null;
function reproj(img,bb,R,ow,oh){const s=document.createElement('canvas');s.width=img.width;s.height=img.height;const sg=s.getContext('2d');sg.drawImage(img,0,0);const sd=sg.getImageData(0,0,s.width,s.height).data;
 const cv=document.createElement('canvas');cv.width=ow;cv.height=oh;const g=cv.getContext('2d'),out=g.createImageData(ow,oh),o=out.data,[w0,s0,e0,n0]=bb;
 for(let j=0;j<oh;j++){const y=R.y1-(j+.5)/oh*(R.y1-R.y0);for(let i=0;i<ow;i++){const x=R.x0+(i+.5)/ow*(R.x1-R.x0);const[la,lo]=P.inv(x,y);const u=Math.floor((lo-w0)/(e0-w0)*s.width),v=Math.floor((n0-la)/(n0-s0)*s.height);
  if(u<0||v<0||u>=s.width||v>=s.height)continue;const k=(v*s.width+u)*4;if(sd[k+3]<10)continue;const q=(j*ow+i)*4;o[q]=sd[k];o[q+1]=sd[k+1];o[q+2]=sd[k+2];o[q+3]=Math.min(200,sd[k+3])}}
 g.putImageData(out,0,0);return{cv,R,a:1}}
function blit(g,L){const R=L.R,sx=W/(V.x1-V.x0),cw=L.cv.width/(R.x1-R.x0),ch=L.cv.height/(R.y1-R.y0);// draw region R of frame into current view
 const x0=Math.max(V.x0,R.x0),x1=Math.min(V.x1,R.x1),y0=Math.max(V.y0,R.y0),y1=Math.min(V.y1,R.y1);if(x1<=x0||y1<=y0)return;
 g.globalAlpha=L.a;g.drawImage(L.cv,(x0-R.x0)*cw,(R.y1-y1)*ch,(x1-x0)*cw,(y1-y0)*ch,(x0-V.x0)*sx,(V.y1-y1)*sx,(x1-x0)*sx,(y1-y0)*sx);g.globalAlpha=1}
function drawRadar(){const g=$('radar').getContext('2d');g.clearRect(0,0,W,H);if(!radarOn||!RF)return;g.imageSmoothingEnabled=true;blit(g,RF);if(RHi&&RHi.a>0)blit(g,RHi)}
function hiRadar(){clearTimeout(rhT);rhT=setTimeout(()=>{if(!radarOn||anim)return;const z=(P.c.xmax-P.c.xmin)/(V.x1-V.x0);if(z<2.5){RHi=null;drawRadar();return}
 const pad=(V.x1-V.x0)*.15,R={x0:V.x0-pad,x1:V.x1+pad,y0:V.y0-pad,y1:V.y1+pad},cs=[[R.x0,R.y0],[R.x1,R.y0],[R.x0,R.y1],[R.x1,R.y1],[(R.x0+R.x1)/2,R.y1],[(R.x0+R.x1)/2,R.y0]].map(([x,y])=>P.inv(x,y));
 const bb=[Math.min(...cs.map(c=>c[1])),Math.min(...cs.map(c=>c[0])),Math.max(...cs.map(c=>c[1])),Math.max(...cs.map(c=>c[0]))].map(v=>v.toFixed(2));
 const im=new Image();im.onload=()=>{const ow=Math.min(1600,Math.round(W*1.3/ (DPR>1?1.5:1))),L=reproj(im,bb.map(Number),R,ow,Math.round(ow*(R.y1-R.y0)/(R.x1-R.x0)));L.a=0;RHi=L;const t0=performance.now();
  const f=now=>{L.a=Math.min(1,(now-t0)/500);drawRadar();if(L.a<1&&RHi===L)requestAnimationFrame(f)};requestAnimationFrame(f)};
 im.src=`/api/radar?bbox=${bb}&w=1600&t=${Math.floor(Date.now()/24e4)}`},500)}
function loadRadar(){if(!radarOn)return;const im=new Image();im.onload=()=>{radarImg=im;radarT=new Date();$('rtime').textContent='Radar '+fmt(radarT);RF=reproj(im,[-127,22,-64,52],full(),2560,Math.round(2560*(P.c.ymax-P.c.ymin)/(P.c.xmax-P.c.xmin)));RHi=null;drawRadar();hiRadar()};im.src='/api/radar?t='+Date.now()}
function setRadar(v){radarOn=v;localStorage.radar=v?'1':'0';$('radarBtn').textContent='RADAR '+(v?'ON':'OFF')+' (R)';$('radarBtn').classList.toggle('on',v);if(v&&!radarImg)loadRadar();if(!v)$('rtime').textContent='';drawRadar()}
const fmt=(d,z)=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Chicago',timeZoneName:z===false?undefined:'short'});
const fmtD=d=>new Date(d).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:'America/Chicago',timeZoneName:'short'});
function drawRoute(){const g=$('route').getContext('2d');g.clearRect(0,0,W,H);if(!planData)return;const pts=planData.route.map(p=>px(p.lat,p.lon));
 g.lineCap=g.lineJoin='round';g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=W/260;g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
 g.strokeStyle='#d4007a';g.lineWidth=W/600;g.stroke();
 g.font=`800 ${W/95}px Helvetica Neue,Arial`;planData.route.forEach((p,i)=>{const[x,y]=pts[i];const end=i==0||i==pts.length-1;g.fillStyle='#fff';g.strokeStyle='#d4007a';g.lineWidth=W/700;g.beginPath();g.arc(x,y,W/(end?260:420),0,7);g.fill();g.stroke();
  if(end){g.lineWidth=W/400;g.strokeStyle='#fff';g.strokeText(p.id,x+W/170,y-W/170);g.fillStyle='#111';g.fillText(p.id,x+W/170,y-W/170)}})}
let VER=null;function prefetch(){if(planData)for(const a of[planData.dep.id,planData.dest.id])spotData(a).catch(()=>{})}
async function loadPlan(){try{const j=await(await fetch('/api/plan',{cache:'no-store'})).json();
 if(VER&&j.version&&j.version!==VER){location.reload();return}VER=VER||j.version;// new deploy -> reload so TVs pick up new code
 let c=null;try{c=JSON.parse(localStorage.lmPlan||'null')}catch{}
 if(j.plan){planData=j.plan;localStorage.lmPlan=JSON.stringify({plan:j.plan,boot:j.boot})}
 else if(c&&c.boot!==j.boot&&c.plan.expires>Date.now())planData=c.plan;// server restarted (free plan wipes /tmp): keep showing the last plan
 else{planData=null;if(c&&c.boot===j.boot)localStorage.removeItem('lmPlan')}prefetch()}catch{}const el=$('plan');
 if(planData){el.style.display='block';$('pRoute').textContent=planData.dep.id+' → '+planData.dest.id;$('pDep').textContent=fmtD(planData.etd);$('pEta').textContent=fmtD(planData.eta);
  $('pVia').textContent=planData.route.map(p=>p.id).join(' ');$('pDist').textContent=planData.distNm+' NM';}else el.style.display='none';drawRoute()}
let lastOk=0;async function loadMetars(){try{const j=await(await fetch('/api/metars',{cache:'no-store'})).json();stations=j.stations;lastOk=Date.now();$('stale').style.display='none';drawLeds()}catch{}}
function tick(){$('clock').textContent='Updated '+(lastOk?fmt(lastOk):'—');if(lastOk&&Date.now()-lastOk>15*6e4)$('stale').style.display='inline'}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='r'||k==='enter'||k===' '||e.keyCode===403||e.keyCode===13){e.preventDefault();setRadar(!radarOn)}});
$('radarBtn').onclick=()=>setRadar(!radarOn);
(async()=>{const c=await(await fetch('/chart.json')).json();initProj(c);V=full();const big=Math.max(screen.width,screen.height)*(window.devicePixelRatio||1)>2200;
 if(Q.get('lat')&&Q.get('lon')){const z=+Q.get('zoom')||8;V=viewAt(+Q.get('lat'),+Q.get('lon'),z)}
 fetch('/tiles/0/0/0.webp',{method:'HEAD'}).then(r=>{tilesOK=r.ok;queueBase()}).catch(()=>{});
 await new Promise(ok=>{const im=new Image();im.onload=()=>{chartOK=true;fullImg=im;ok()};im.onerror=ok;im.src=big?'/chart.jpg':'/chart-1080.jpg'});
 if(!chartOK)states=await(await fetch('/us-states.geojson')).json();
 size();addEventListener('resize',size);setRadar(radarOn);$('radarBtn').focus();initZoom();
 await Promise.all([loadMetars(),loadPlan()]);tick();
 setInterval(loadMetars,5*6e4);setInterval(loadPlan,6e4);startCycle();setInterval(()=>loadRadar(),5*6e4);setInterval(tick,15e3);
 setInterval(()=>fetch('/api/ping',{cache:'no-store'}).catch(()=>{}),5*6e4);// keep-alive for Render free plan
 setTimeout(()=>location.reload(),6*36e5);// daily-ish hard refresh for kiosk memory hygiene
})();

// ---------- View / zoom (wheel, drag, pinch, +/-/0 keys; ?lat=&lon=&zoom=) ----------
let tilesOK=false,anim=0,userT=0;
function full(){const c=P.c;return{x0:c.xmin,x1:c.xmax,y0:c.ymin,y1:c.ymax}}
function viewAt(lat,lon,z,fx=.5,fy=.5){const c=P.c,w=(c.xmax-c.xmin)/z,h=(c.ymax-c.ymin)/z,[x,y]=P.fwd(lat,lon);return clampV({x0:x-w*fx,x1:x+w*(1-fx),y1:y+h*fy,y0:y-h*(1-fy)})}
function clampV(v){const c=P.c,w=Math.min(v.x1-v.x0,c.xmax-c.xmin),h=w*(c.ymax-c.ymin)/(c.xmax-c.xmin);let x0=Math.max(c.xmin,Math.min(v.x0,c.xmax-w)),y0=Math.max(c.ymin,Math.min(v.y0,c.ymax-h));return{x0,x1:x0+w,y0,y1:y0+h}}
function redraw(){drawBase();drawRadar();drawRoute();drawLeds();if(!anim)hiRadar()}
function setView(v,ms=0,arc=0){v=clampV(v);cancelAnimationFrame(anim);if(!ms){anim=0;V=v;redraw();return Promise.resolve()}
 const a=V,t0=performance.now(),wa=a.x1-a.x0,wb=v.x1-v.x0,ax=(a.x0+a.x1)/2,ay=(a.y0+a.y1)/2,bx=(v.x0+v.x1)/2,by=(v.y0+v.y1)/2,asp=(a.y1-a.y0)/wa;
 const dist=Math.hypot(bx-ax,by-ay),B=arc?Math.max(0,Math.log(Math.min(P.c.xmax-P.c.xmin,Math.max(wa,wb,dist*1.4))/Math.max(wa,wb))):0;// zoom-out bump for the arc
 return new Promise(done=>{const step=now=>{const r=Math.min(1,(now-t0)/ms),k=r<.5?4*r*r*r:1-(-2*r+2)**3/2;// easeInOutCubic
  const lw=Math.log(wa)+(Math.log(wb)-Math.log(wa))*k+B*Math.sin(Math.PI*k),w=Math.exp(lw),h=w*asp;
  // move the centre proportionally to the log-zoom so the target stays put on screen as we dive in
  const cx=ax+(bx-ax)*k,cy=ay+(by-ay)*k;V={x0:cx-w/2,x1:cx+w/2,y0:cy-h/2,y1:cy+h/2};
  if(r<1){anim=requestAnimationFrame(step);drawBase();drawRadar();drawRoute();drawLeds()}else{anim=0;V=v;redraw();done()}};anim=requestAnimationFrame(step)})}
function levelFor(v){const c=P.c,FW=c.xmax-c.xmin;return Math.max(0,Math.min(c.maxLevel||0,Math.ceil(Math.log2(W*FW/((v.x1-v.x0)*c.w))-0.15)))}
function preload(v,ms=2500){if(!tilesOK)return Promise.resolve();v=clampV(v);const c=P.c,L=levelFor(v),mt=(c.xmax-c.xmin)/(c.w*2**L)*c.tile,ps=[];
 for(const l of[L,Math.max(0,L-1),Math.max(0,L-2)]){const m=(c.xmax-c.xmin)/(c.w*2**l)*c.tile;
  for(let ty=Math.max(0,Math.floor((c.ymax-v.y1)/m));ty<=Math.floor((c.ymax-v.y0)/m);ty++)for(let tx=Math.max(0,Math.floor((v.x0-c.xmin)/m));tx<=Math.floor((v.x1-c.xmin)/m);tx++){const t=tileImg(l,tx,ty);
   if(!t.ok&&!t.bad)ps.push(new Promise(r=>{t.im.addEventListener('load',r,{once:true});t.im.addEventListener('error',r,{once:true})}))}}
 return Promise.race([Promise.all(ps),new Promise(r=>setTimeout(r,ms))])}
function zoomBy(f,sx=.5,sy=.5){const w=V.x1-V.x0,h=V.y1-V.y0,mx=V.x0+w*sx,my=V.y1-h*sy,nw=Math.min(P.c.xmax-P.c.xmin,w/f),nh=nw*h/w;userT=Date.now();setView({x0:mx-nw*sx,x1:mx+nw*(1-sx),y1:my+nh*sy,y0:my-nh*(1-sy)})}
function initZoom(){const el=$('wrap');document.body.style.cursor='default';
 el.addEventListener('wheel',e=>{e.preventDefault();const r=el.getBoundingClientRect();zoomBy(Math.exp(-e.deltaY*.0018),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
 const pts=new Map();let last=null;
 el.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointerup',e=>{pts.delete(e.pointerId);last=null});el.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);last=null});
 el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const r=el.getBoundingClientRect();const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===1){if(Math.hypot(e.clientX-prev[0],e.clientY-prev[1])>12)userT=Date.now();const w=V.x1-V.x0,h=V.y1-V.y0,dx=(e.clientX-prev[0])/r.width*w,dy=(e.clientY-prev[1])/r.height*h;setView({x0:V.x0-dx,x1:V.x1-dx,y0:V.y0+dy,y1:V.y1+dy})}
  else if(pts.size===2){const[p,q]=[...pts.values()],d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(last)zoomBy(d/last,((p[0]+q[0])/2-r.left)/r.width,((p[1]+q[1])/2-r.top)/r.height);last=d}});
 document.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='='||e.keyCode===427)zoomBy(1.6);else if(e.key==='-'||e.keyCode===428)zoomBy(1/1.6);else if(e.key==='0'){userT=0;setView(full(),600)}});}
// ---------- Airport Spotlight (only while a flight plan is loaded): map -> DEP -> map -> DEST, every ?cycle= s (default 10) ----------
const CYC=Math.max(3,+(Q.get('cycle')||15))*1000,SP={},CATC={VFR:'#00a83a',MVFR:'#0a50ff',IFR:'#e00010',LIFR:'#c000c0'};let phase=0,cycT=null,spotOn=null,tok=0;
function startCycle(){clearInterval(cycT);cycT=setInterval(cycStep,CYC)}
function cycStep(){if(!planData){if(spotOn)hideSpot();phase=0;return}if(Date.now()-userT<30e3)return;// pause after manual zoom/pan
 phase=(phase+1)%4;tok++;if(phase===1)showSpot(planData.dep.id,'DEPARTURE');else if(phase===3)showSpot(planData.dest.id,'DESTINATION');else hideSpot()}
const FLY=3000;function hideSpot(){const was=spotOn;spotOn=null;$('spot').classList.remove('on');// card fades out first, then fly back
 if(!was){return}setTimeout(()=>{if(spotOn)return;$('dim').classList.remove('on');$('radarBtn').style.visibility='';preload(full(),800).then(()=>{if(!spotOn)setView(full(),FLY,1)})},700)}
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function spotData(id){const s=SP[id];if(s&&Date.now()-s.t<120e3)return s.d;const d=await(await fetch('/api/spot?id='+id)).json();SP[id]={t:Date.now(),d,apd:s?.apd,aer:s?.aer};
 if(!SP[id].aer){const im=new Image();im.src=`/api/aerial?lat=${d.lat}&lon=${d.lon}&span=${spanFor(d)}`;SP[id].aer=im}
 if(d.apd&&!SP[id].apd)SP[id].apd=renderApd(id);return d}
function spanFor(d){const L=Math.max(3000,...(d.runways||[]).map(r=>+String(r.dimension).split('x')[0]||0));return Math.min(.05,Math.max(.012,L/364000*.85))}
let pdfjs=null;async function renderApd(id){try{pdfjs=pdfjs||await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
 const doc=await pdfjs.getDocument('/api/apd?id='+id).promise,pg=await doc.getPage(1),vp=pg.getViewport({scale:3}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
 await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;return cv.toDataURL('image/png')}catch(e){console.warn('apd',e);return null}}
const ft=m=>Math.round(m*3.28084);
function decode(m){if(!m)return null;const wind=m.wspd===0?'Calm':(m.wdir==='VRB'?'VRB':String(m.wdir).padStart(3,'0')+'°')+' '+m.wspd+(m.wgst?'G'+m.wgst:'')+' kt';
 const vis=(String(m.visib).replace('+','')==='10'?'10+':m.visib)+' SM';const cl=(m.clouds||[]);const ceil=cl.find(c=>/BKN|OVC|OVX/.test(c.cover));
 const sky=cl.length?cl.map(c=>c.cover+(c.base!=null?String(Math.round(c.base/100)).padStart(3,'0'):'')).join(' '):(m.cover||'CLR');
 const alt=m.altim?(m.altim*0.02953).toFixed(2)+' inHg':'—',cF=t=>t==null?'—':t.toFixed(0)+'°C';
 return{wind,vis,ceil:ceil?ceil.base.toLocaleString()+' ft '+ceil.cover:'None',sky,td:cF(m.temp)+' / '+cF(m.dewp),alt,wx:m.wxString||'',obs:new Date(m.obsTime*1000)}}
function tafLines(t){if(!t)return'';return t.rawTAF.replace(/\s+(FM\d{6}|TEMPO|BECMG|PROB\d{2})/g,'\n$1').split('\n').slice(0,6).join('\n')}
async function showSpot(id,role){const my=tok;let d;try{d=await spotData(id)}catch{return}if(!planData||my!==tok)return;spotOn=id;const s=SP[id],m=decode(d.metar),cat=d.metar?.fltCat||'';
 const apd=s.apd?await Promise.race([s.apd,new Promise(r=>setTimeout(()=>r(null),4000))]):null;if(spotOn!==id||my!==tok)return;
 const aerCap='Aerial imagery: USGS National Map (NAIP orthoimagery)';
 const aer=`<div class="img"><div class="lab2">Aerial View</div><div class="box"><img src="${s.aer.src}" style="width:100%;height:100%;object-fit:cover"></div><div class="cap">${aerCap}${apd?'':' · no FAA airport diagram published for '+esc(id)}</div></div>`;
 const imgs=apd?`<div class="img"><div class="lab2">FAA Airport Diagram</div><div class="box" style="background:#fff"><img src="${apd}"></div><div class="cap">FAA d-TPP cycle ${esc(d.apd.cycle)} · ${esc(d.apd.pdf)} · not for navigation</div></div>`:aer;
 const kv=(k,v)=>`<div class="kv"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`;
 $('spot').innerHTML=`<div class="hd"><div class="sid">${esc(id)}</div><div><div class="snm">${esc(d.name.trim())}</div><div class="ssub">${role} · Elev ${esc(d.elev!=null?ft(d.elev)+' ft':'—')} · ${(d.runways||[]).map(r=>esc(r.id)).join('  ')}</div></div>${cat?`<div class="cat" style="background:${CATC[cat]||'#555'}">${cat}</div>`:''}</div>
 <div class="bd"><div class="wx">${m?kv('Wind',m.wind)+kv('Visibility',m.vis)+kv('Ceiling',m.ceil)+kv('Sky',m.sky)+(m.wx?kv('Weather',m.wx):'')+kv('Temp / Dew',m.td)+kv('Altimeter',m.alt)+
  `<div class="lab2">METAR · ${fmt(m.obs)}</div><div class="raw">${esc(d.metar.rawOb)}</div>`:'<div class="raw">No current METAR for '+esc(id)+'</div>'}
  <div class="lab2">TAF ${d.taf?(d.tafNear?`· nearest: ${esc(d.taf.icaoId)} (${d.tafNear} NM) — none issued for ${esc(id)}`:''):''}</div><div class="raw">${d.taf?esc(tafLines(d.taf)):'No TAF within 40 NM'}</div>${apd?aer:''}</div>${imgs}</div>
 <div class="phase">AIRPORT SPOTLIGHT · ${role==='DEPARTURE'?'1':'2'}/2</div>`;
 $('dim').classList.add('on');$('radarBtn').style.visibility='hidden';const tgt=viewAt(d.lat,d.lon,14,.15,.42);
 await preload(tgt,2000);if(my!==tok)return;await setView(tgt,FLY,1);if(my!==tok)return;$('spot').classList.add('on')}
</script></body></html>
